name: Build

# Real build verification for this repo's shipping components -- runs on a
# genuine Windows MSVC toolchain, no simulation. Builds the actual DLLs that
# ship to players: the main mod (proxy_d3d9), the netcode-security
# component's own standalone DLL, and its "greenlit" plugin variant.
#
# Deliberately does NOT build tools/iw5oat -- that's developer/research
# tooling only, never shipped to players (see README.md's "Repository
# structure" table), and its premake-generated build tree has its own known
# fragility documented in re_notes/known_issues_x64.md (a RawTemplater
# CustomBuild-batching quirk that needed a build-artifact-only workaround
# applied by hand, not from source) that's out of scope for a basic
# buildability check on the shipping product.
#
# This backs README.md's own "build" badge -- if this workflow is failing,
# that badge tells the truth about it rather than a hand-maintained claim
# drifting stale.

on:
  push:
    branches: [main]
    paths:
      - "proxy_d3d9/**"
      - "security/proxy_d3d9/**"
      - "security/tools/ncp_plugin_netcode_fixes/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "proxy_d3d9/**"
      - "security/proxy_d3d9/**"
      - "security/tools/ncp_plugin_netcode_fixes/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Least-privilege: this workflow only checks out and builds, it never writes
# back to the repo or any GitHub API resource.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy_d3d9 (main mod)
            project: proxy_d3d9/proxy_d3d9.vcxproj
          - name: security proxy_d3d9 (standalone)
            project: security/proxy_d3d9/proxy_d3d9.vcxproj
          - name: security plugin (ncp_plugin_netcode_fixes)
            project: security/tools/ncp_plugin_netcode_fixes/ncp_plugin_netcode_fixes.vcxproj

    steps:
      # 2026-09-24: submodules: true added after a real CI failure -- dxvk/'s
      # own five real submodules (Vulkan-Headers, SPIRV-Headers,
      # mingw-directx-headers, dxbc-spirv, libdisplay-info) had .gitmodules
      # entries missing entirely at the repo root until this same commit (see
      # .gitmodules and dxvk/.gitmodules's own pre-existing, never-merged
      # copy), so even with that fixed, a plain checkout still leaves them as
      # empty gitlink directories without this flag -- confirmed the actual
      # cause via the real failing run (C1083: vulkan/vulkan_core.h not found).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # 2026-09-28: the main mod links against ncnn (proxy_d3d9/third_party/ncnn/lib/)
      # for the runtime texture-upscale-cache feature -- those .lib files are
      # gitignored (real, large, rebuildable CMake/MSVC output, same convention as
      # every other vendored-but-not-committed binary in this repo), so a plain
      # checkout leaves nothing for the linker and this job fails with a real
      # LNK1181 ("cannot open input file 'ncnn.lib'"). Only the main-mod matrix
      # entry needs this -- the other two projects don't reference ncnn at all.
      - name: Cache ncnn build (Vulkan, static CRT)
        if: matrix.project == 'proxy_d3d9/proxy_d3d9.vcxproj'
        id: ncnn-cache
        uses: actions/cache@v4
        with:
          path: proxy_d3d9/third_party/ncnn/lib
          key: ncnn-20260526-vulkan-staticcrt-${{ hashFiles('proxy_d3d9/third_party/ncnn/build_ncnn.bat') }}

      # Vulkan SDK is only needed to build ncnn from source (its CMake config
      # requires the SDK's headers to be found via VULKAN_SDK, even though ncnn
      # itself uses its own in-house Vulkan function loader rather than linking
      # vulkan-1.lib -- see build_ncnn.bat's own header comment). Skipped
      # entirely on a cache hit.
      - name: Install Vulkan SDK
        if: matrix.project == 'proxy_d3d9/proxy_d3d9.vcxproj' && steps.ncnn-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/VulkanSDK.exe" -OutFile "$env:RUNNER_TEMP\VulkanSDK.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\VulkanSDK.exe" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkDir = Get-ChildItem "C:\VulkanSDK" | Select-Object -First 1
          echo "VULKAN_SDK=C:\VulkanSDK\$($sdkDir.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Builds real ncnn from source (Tencent/ncnn, pinned tag, matching this
      # project's own documented local process exactly -- same script a
      # developer runs locally, not a CI-only shortcut) whenever the cache
      # above misses. This is real build verification, same philosophy as the
      # rest of this workflow -- not a stub or a prebuilt-binary download.
      - name: Build ncnn from source
        if: matrix.project == 'proxy_d3d9/proxy_d3d9.vcxproj' && steps.ncnn-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: proxy_d3d9/third_party/ncnn
        run: build_ncnn.bat

      - name: Build ${{ matrix.name }} (Release x64)
        run: msbuild "${{ matrix.project }}" /p:Configuration=Release /p:Platform=x64 /m /warnaserror:false
